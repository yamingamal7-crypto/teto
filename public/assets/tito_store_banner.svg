<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="60%" stop-color="#050505" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="redLaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0" />
      <stop offset="50%" stop-color="#dc2626" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="redGlowCenter" cx="45%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#dc2626" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="450" fill="url(#bgGrad)"/>
  <rect width="1200" height="450" fill="url(#redGlowCenter)"/>

  <!-- Left Side: Stylized Mechanical Auto Parts Outlines & Silhouette -->
  <g transform="translate(60, 40)" opacity="0.85">
    <!-- Brake Rotor Disc -->
    <circle cx="210" cy="210" r="140" fill="#141414" stroke="#2a2a2a" stroke-width="4"/>
    <circle cx="210" cy="210" r="120" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="12,8" opacity="0.6"/>
    <circle cx="210" cy="210" r="70" fill="#0d0d0d" stroke="#333333" stroke-width="3"/>
    <!-- Ventilation Holes -->
    <g fill="#222222">
      <circle cx="210" cy="115" r="5"/><circle cx="210" cy="305" r="5"/>
      <circle cx="115" cy="210" r="5"/><circle cx="305" cy="210" r="5"/>
      <circle cx="145" cy="145" r="5"/><circle cx="275" cy="275" r="5"/>
      <circle cx="145" cy="275" r="5"/><circle cx="275" cy="145" r="5"/>
    </g>
    <!-- Center Hub & Studs -->
    <circle cx="210" cy="210" r="35" fill="#1a1a1a" stroke="#dc2626" stroke-width="2"/>
    <circle cx="210" cy="190" r="6" fill="#e5e5e5"/>
    <circle cx="230" cy="218" r="6" fill="#e5e5e5"/>
    <circle cx="190" cy="218" r="6" fill="#e5e5e5"/>

    <!-- Brake Caliper & Pads -->
    <path d="M 90,130 Q 110,90 170,80 L 190,140 Q 140,150 110,180 Z" fill="#222" stroke="#dc2626" stroke-width="2.5"/>

    <!-- Suspension Coilover Spring (Vertical) -->
    <g transform="translate(320, 60)">
      <rect x="35" y="0" width="10" height="280" fill="#1a1a1a" stroke="#333"/>
      <!-- Spring Coils -->
      <path d="M 0,40 Q 40,20 80,40 Q 40,60 0,80 Q 40,60 80,80 Q 40,100 0,120 Q 40,100 80,120 Q 40,140 0,160 Q 40,140 80,160 Q 40,180 0,200 Q 40,180 80,200 Q 40,220 0,240" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    </g>

    <!-- Timing Gear and Belt -->
    <g transform="translate(140, 10)">
      <circle cx="100" cy="40" r="40" fill="#111" stroke="#444" stroke-width="3"/>
      <circle cx="100" cy="40" r="15" fill="#dc2626"/>
    </g>
  </g>

  <!-- Dramatic Laser Cut Angle in the Center -->
  <polygon points="560,0 600,0 480,450 440,450" fill="#dc2626" opacity="0.75"/>
  <line x1="560" y1="0" x2="440" y2="450" stroke="#ff4444" stroke-width="2" opacity="0.9"/>

  <!-- Right Side: Official Brand Typography & Details -->
  <g transform="translate(630, 85)">
    <!-- TITO Official Big Wordmark -->
    <g transform="translate(20, 30)">
      <!-- T (Red) -->
      <path d="M 0,0 L 80,0 L 80,24 L 52,24 L 52,90 L 28,90 L 28,24 L 0,24 Z" fill="#dc2626" />
      <!-- I (White) -->
      <path d="M 100,0 L 128,0 L 128,90 L 100,90 Z" fill="#ffffff" />
      <!-- T (White) -->
      <path d="M 150,0 L 230,0 L 230,24 L 202,24 L 202,90 L 178,90 L 178,24 L 150,24 Z" fill="#ffffff" />
      <!-- O (White) -->
      <path d="M 290,0 C 335,0 360,16 360,45 C 360,74 335,90 290,90 C 245,90 220,74 220,45 C 220,16 245,0 290,0 Z M 290,24 C 268,24 252,32 252,45 C 252,58 268,66 290,66 C 312,66 328,58 328,45 C 328,32 312,24 290,24 Z" fill="#ffffff" />
    </g>

    <!-- Red Bars + STORE -->
    <g transform="translate(20, 150)">
      <rect x="0" y="8" width="65" height="6" fill="#dc2626" rx="3"/>
      <text x="180" y="16" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="14" text-anchor="middle">
        STORE
      </text>
      <rect x="295" y="8" width="65" height="6" fill="#dc2626" rx="3"/>
    </g>

    <!-- POWERED BY ZEUS -->
    <g transform="translate(20, 205)">
      <text x="180" y="0" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" letter-spacing="5" text-anchor="middle">
        POWERED BY <tspan fill="#dc2626" font-weight="900">ZEUS</tspan>
      </text>
    </g>

    <!-- Official Four Car Brands (White, Spaced, Crisp) -->
    <g transform="translate(20, 260)">
      <text x="180" y="0" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="3" text-anchor="middle">
        CHEVROLET  <tspan fill="#dc2626">|</tspan>  OPEL  <tspan fill="#dc2626">|</tspan>  MG  <tspan fill="#dc2626">|</tspan>  ESPERANZA
      </text>
    </g>
  </g>
</svg>
